name: mcp_bridge
version: 1.0.0
description: >
  MCP (Model Context Protocol) bridge. Spawns each configured MCP
  server as a subprocess and exposes its tools to the agent under
  `mcp:<server>/<tool>` names. Default agent paths pay zero cost —
  only loaded when --with-mcp is passed.
author: AgenticLLM
hooks:
  - on_startup       # registry init from mcp_config.json
  - on_shutdown      # graceful subprocess teardown
config: mcp_config.json
entry: mcp_bridge.py
