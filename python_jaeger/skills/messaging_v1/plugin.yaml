name: messaging
version: 1.0.0
description: >
  Discord / Telegram / iMessage bridges + multi-channel gateway daemon.
  Each bridge registers with a shared in-process registry so the agent's
  `send_message(channel, recipient, text)` skill can push to any live
  channel. Per-channel session keys keep rolling-history isolated.
author: AgenticLLM
hooks:
  - on_inbound_message   # bridge → agent (per-channel session)
  - on_agent_send        # agent → bridge (send_message tool)
bridges:
  - discord_bridge.py    # requires DISCORD_BOT_TOKEN
  - telegram_bridge.py   # requires TELEGRAM_BOT_TOKEN
  - imessage_bridge.py   # macOS only; requires IMESSAGE_ALLOWED_HANDLES
entry: gateway.py
